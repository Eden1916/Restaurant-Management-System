services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres 
      POSTGRES_DB: restaurant 
    volumes:
      - db-data:/var/lib/postgresql/data
      # These run automatically, in this order, the first time the database is created
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./restaurant-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgres@db:5432/restaurant
      JWT_SECRET: local-dev-jwt-secret
      JWT_EXPIRE: 7d
      SESSION_SECRET: local-dev-session-secret
      BACKEND_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:5173
      # Optional integrations: set them in a root .env file to enable them
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-client-secret}
      CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./restaurant-frontend
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_GOOGLE_SIGN_IN: http://localhost:5000/api/auth/google
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db-data:
  uploads:
